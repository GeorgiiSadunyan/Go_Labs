<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Lab Call</title>
    <style>
        /* --- СТИЛИ (CSS) --- */
        :root {
            --bg-color: #202124;
            --card-bg: #292a2d;
            --primary: #8ab4f8;
            --danger: #f28b82;
            --success: #81c995;
            --text: #e8eaed;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
        }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Формы и кнопки */
        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #5f6368;
            background: var(--card-bg);
            color: white;
            font-size: 16px;
            outline: none;
            width: 250px;
            margin-bottom: 10px;
        }
        input:focus { border-color: var(--primary); }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            margin: 5px;
        }
        .btn-primary { background: var(--primary); color: #202124; }
        .btn-success { background: var(--success); color: #202124; }
        .btn-danger { background: var(--danger); color: #202124; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Видео контейнер */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Remote video (большое) */
        #remoteVideo { background: #1a1a1a; }

        /* Local video (маленькое в углу) */
        #localVideo {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 100px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transform: scaleX(-1); /* Зеркалим свое видео */
        }

        /* Модальное окно входящего звонка */
        #incomingModal {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            padding: 20px 40px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 100;
            border: 1px solid var(--primary);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            background: #3c4043;
            font-size: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="incomingModal">
        <span>Входящий звонок от <b id="callerName">...</b></span>
        <button class="btn-success" onclick="acceptCall()">Принять</button>
        <button class="btn-danger" onclick="declineCall()">Отклонить</button>
    </div>

    <div class="container">
        <div id="loginScreen" class="screen active">
            <h1>WebRTC Вход</h1>
            <p>Введите имя для начала работы</p>
            <input type="text" id="usernameInput" placeholder="Ваше имя (например: user1)">
            <br>
            <button class="btn-primary" onclick="login()">Войти в систему</button>
        </div>

        <div id="callScreen" class="screen">
            <div class="status-badge">Вы вошли как: <span id="myUsernameDisplay"></span></div>
            
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted></video>
                <div id="videoPlaceholder" style="position: absolute; top:50%; left:50%; transform:translate(-50%, -50%); color: #5f6368;">
                    Ожидание видео...
                </div>
            </div>

            <div id="controls">
                <div id="callForm">
                    <input type="text" id="targetInput" placeholder="Имя друга (например: user2)">
                    <button class="btn-primary" id="btnCall" onclick="startSession()">Позвонить</button>
                </div>

                <div id="activeCallControls" style="display: none;">
                    <button class="btn-danger" onclick="hangup()">Завершить звонок</button>
                </div>
                
                <p id="statusMsg" style="color: #9aa0a6; margin-top: 10px;">Готов к звонку</p>
            </div>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const API_URL = 'http://' + window.location.host + '/api';
        const WS_URL = 'ws://' + window.location.host + '/ws';
        
        // ICE сервера (используем публичные Google сервера для прохождения NAT)
        const rtcConfig = {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        };

        // --- СОСТОЯНИЕ ---
        let token = localStorage.getItem('jwt_token') || '';
        let myUsername = '';
        let ws = null;
        let peerConnection = null;
        let localStream = null;
        let currentSessionId = null;
        let isCaller = false;

        // --- UI ФУНКЦИИ ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setStatus(msg) {
            document.getElementById('statusMsg').innerText = msg;
        }

        // --- ЛОГИКА АВТОРИЗАЦИИ ---
        async function login() {
            const username = document.getElementById('usernameInput').value;
            if (!username) return alert('Введите имя');

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    body: JSON.stringify({ username }),
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                token = data.token;
                myUsername = username;
                
                document.getElementById('myUsernameDisplay').innerText = myUsername;
                connectWebSocket();
                showScreen('callScreen');
                setupLocalVideo();
            } catch (e) {
                alert('Ошибка входа: ' + e);
            }
        }

        // --- WEBSOCKET И СИГНАЛИНГ ---
        function connectWebSocket() {
            ws = new WebSocket(`${WS_URL}?token=${token}`);
            
            ws.onopen = () => setStatus("WebSocket подключен. Готов.");
            
            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);

                // 1. Обновление статуса сессии
                if (msg.type === 'session_updated') {
                    handleSessionUpdate(msg);
                } 
                // 2. WebRTC сигналы (offer, answer, ice)
                else if (msg.signal) {
                    handleSignal(msg.signal);
                }
            };

            ws.onclose = () => setStatus("WS отключен");
        }

        function handleSessionUpdate(data) {
            currentSessionId = data.sessionId;
            const targetUser = data.target === myUsername ? 'Входящий' : data.target;

            if (data.status === 'pending') {
                // Если я тот, КОМУ звонят - показываем кнопку ответа
                if (data.target === myUsername) { // target здесь - это получатель звонка
                     // Внимание: сервер в notifySessionUpdate шлет target как есть.
                     // Если я Caller, то target - это друг. Если я Target, то target - это я.
                     // Надо понять, кто звонит. В simple версии сервера Caller/Target жестко заданы.
                     // Упростим: если статус pending и я не начинал звонок -> это входящий.
                     if (!isCaller) {
                         document.getElementById('callerName').innerText = "Друг"; // Сервер не прислал имя Caller в этом событии, упрощаем
                         document.getElementById('incomingModal').style.display = 'block';
                         setStatus("Входящий звонок...");
                     } else {
                         setStatus("Звоним... Ожидание ответа");
                     }
                } else if (isCaller) {
                    setStatus("Звоним... Ожидание ответа друга");
                }
            } else if (data.status === 'active') {
                document.getElementById('incomingModal').style.display = 'none';
                document.getElementById('callForm').style.display = 'none';
                document.getElementById('activeCallControls').style.display = 'block';
                setStatus("Соединение установлено!");
                
                // СЕССИЯ АКТИВНА: Инициатор (Caller) начинает WebRTC P2P
                if (isCaller) {
                    createOffer();
                }
            } else if (data.status === 'declined' || data.status === 'cancelled') {
                resetCallUI();
                setStatus("Звонок завершен (" + data.status + ")");
                closePeerConnection();
            }
        }

        // --- REST API ДЛЯ СЕССИЙ ---
        async function startSession() {
            const target = document.getElementById('targetInput').value;
            if(!target) return alert("Введите имя друга");
            isCaller = true;

            await fetch(`${API_URL}/session`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetUsername: target, type: 'video' })
            });
            // Дальше ждем WS события session_updated (pending)
        }

        async function acceptCall() {
            await fetch(`${API_URL}/session/accept`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: currentSessionId })
            });
            // Ждем WS события session_updated (active)
        }

        async function declineCall() {
            await fetch(`${API_URL}/session/decline`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: currentSessionId })
            });
            document.getElementById('incomingModal').style.display = 'none';
        }

        async function hangup() {
             await fetch(`${API_URL}/session`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            // Сервер пришлет cancelled
        }

        // --- WEBRTC LOGIC (P2P) ---

        async function setupLocalVideo() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) {
                console.error("Нет доступа к камере", e);
                setStatus("Ошибка доступа к камере!");
            }
        }

        function createPeerConnection() {
            if (peerConnection) return;

            peerConnection = new RTCPeerConnection(rtcConfig);

            // Добавляем локальные треки (видео/аудио)
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            // Когда пришел ICE кандидат (путь через интернет) - шлем его другу через сервер
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignal('ice-candidate', event.candidate);
                }
            };

            // Когда пришло видео от друга
            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
                document.getElementById('videoPlaceholder').style.display = 'none';
            };
        }

        async function createOffer() {
            createPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            sendSignal('offer', offer);
        }

        async function handleSignal(signal) {
            if (!peerConnection) createPeerConnection();

            if (signal.type === 'offer') {
                // Нам звонят, мы отвечаем
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                sendSignal('answer', answer);
            } else if (signal.type === 'answer') {
                // Мы звонили, нам ответили
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.data));
            } else if (signal.type === 'ice-candidate') {
                // Добавляем сетевой путь
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(signal.data));
                } catch (e) { console.error('Error adding ice', e); }
            }
        }

        function sendSignal(type, data) {
            ws.send(JSON.stringify({
                signal: { type, data }
            }));
        }

        function closePeerConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('videoPlaceholder').style.display = 'block';
        }

        function resetCallUI() {
            document.getElementById('callForm').style.display = 'block';
            document.getElementById('activeCallControls').style.display = 'none';
            document.getElementById('incomingModal').style.display = 'none';
            isCaller = false;
        }
    </script>
</body>
</html>
